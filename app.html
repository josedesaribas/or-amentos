
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrçaPro - Gestão de Orçamentos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.5rem; color: #38bdf8; }
    
    .actions { display: flex; gap: 8px; }
    button { cursor: pointer; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
    .btn-primary { background: #10b981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #ef4444; color: white; padding: 4px 8px; font-size: 0.8rem; }
    .btn-success { background: #10b981; color: white; padding: 4px 8px; font-size: 0.8rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    .card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
    .card p { font-size: 1.6rem; font-weight: bold; }
    .card-green p { color: #34d399; }
    .card-yellow p { color: #fbbf24; }
    .card-blue p { color: #38bdf8; }

    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-size: 0.85rem; }
    tr:last-child td { border-bottom: none; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-pendente { background: #78350f; color: #fef08a; }
    .badge-aprovado { background: #064e3b; color: #a7f3d0; }
    .badge-concluido { background: #0c4a6e; color: #bae6fd; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #334155; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #94a3b8; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>OrçaPro</h1>
      <div class="actions">
        <button class="btn-secondary" onclick="exportarDados()">Exportar</button>
        <button class="btn-secondary" onclick="importarDados()">Importar</button>
        <button class="btn-primary" onclick="abrirModal()">+ Novo Orçamento</button>
      </div>
    </header>

    <div class="cards">
      <div class="card card-green">
        <h3>Dinheiro Certo (Aprovados)</h3>
        <p id="total-aprovado">R$ 0,00</p>
      </div>
      <div class="card card-yellow">
        <h3>Em Análise</h3>
        <p id="total-analise">R$ 0,00</p>
      </div>
      <div class="card card-blue">
        <h3>Concluídos / Pagos</h3>
        <p id="total-concluido">R$ 0,00</p>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filtrar('todos', this)">Todos</button>
      <button class="filter-btn" onclick="filtrar('Em Análise', this)">Em Análise</button>
      <button class="filter-btn" onclick="filtrar('Aprovado', this)">Aprovados</button>
      <button class="filter-btn" onclick="filtrar('Concluído', this)">Concluídos</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Serviço</th>
          <th>Responsável</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-corpo">
      </tbody>
    </table>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 style="margin-bottom: 16px;">Novo Orçamento</h2>
      <div class="form-group">
        <label>Cliente</label>
        <input type="text" id="input-cliente" placeholder="Nome do cliente">
      </div>
      <div class="form-group">
        <label>Serviço</label>
        <input type="text" id="input-servico" placeholder="Descrição do serviço">
      </div>
      <div class="form-group">
        <label>Responsável</label>
        <input type="text" id="input-responsavel" placeholder="Quem atendeu">
      </div>
      <div class="form-group">
        <label>Valor (R$)</label>
        <input type="number" id="input-valor" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="input-status">
          <option value="Em Análise">Em Análise</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Concluído">Concluído</option>
        </select>
      </div>
      <div style="display:flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn-primary" onclick="salvarOrcamento()">Salvar</button>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" style="display:none" onchange="carregarArquivo(event)">

  <script>
    let orcamentos = JSON.parse(localStorage.getItem('orcamentos_dados')) || [];
    let filtroAtual = 'todos';

    function salvarLocal() {
      localStorage.setItem('orcamentos_dados', JSON.stringify(orcamentos));
      renderizar();
    }

    function renderizar() {
      const corpo = document.getElementById('tabela-corpo');
      corpo.innerHTML = '';

      let totAprovado = 0, totAnalise = 0, totConcluido = 0;

      const filtrados = orcamentos.filter(item => {
        if (item.status === 'Aprovado') totAprovado += item.valor;
        if (item.status === 'Em Análise') totAnalise += item.valor;
        if (item.status === 'Concluído') totConcluido += item.valor;

        if (filtroAtual === 'todos') return true;
        return item.status === filtroAtual;
      });

      document.getElementById('total-aprovado').innerText = totAprovado.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      document.getElementById('total-analise').innerText = totAnalise.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      document.getElementById('total-concluido').innerText = totConcluido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

      if (filtrados.length === 0) {
        corpo.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding: 24px;">Nenhum orçamento encontrado.</td></tr>';
        return;
      }

      filtrados.forEach((item, index) => {
        const badgeClass = item.status === 'Aprovado' ? 'badge-aprovado' : (item.status === 'Concluído' ? 'badge-concluido' : 'badge-pendente');
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.cliente}</strong></td>
          <td>${item.servico}</td>
          <td>${item.responsavel}</td>
          <td>R$ ${item.valor.toFixed(2)}</td>
          <td><span class="badge ${badgeClass}">${item.status}</span></td>
          <td>
            ${item.status === 'Em Análise' ? `<button class="btn-success" onclick="mudarStatus(${index}, 'Aprovado')">Aprovar</button>` : ''}
            ${item.status === 'Aprovado' ? `<button class="btn-primary" onclick="mudarStatus(${index}, 'Concluído')">Concluir</button>` : ''}
            <button class="btn-danger" onclick="excluir(${index})">X</button>
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    function abrirModal() { document.getElementById('modal').classList.add('open'); }
    function fecharModal() { document.getElementById('modal').classList.remove('open'); }

    function salvarOrcamento() {
      const cliente = document.getElementById('input-cliente').value;
      const servico = document.getElementById('input-servico').value;
      const responsavel = document.getElementById('input-responsavel').value;
      const valor = parseFloat(document.getElementById('input-valor').value) || 0;
      const status = document.getElementById('input-status').value;

      if (!cliente || !servico) { alert('Preencha cliente e serviço!'); return; }

      orcamentos.push({ cliente, servico, responsavel, valor, status });
      salvarLocal();
      fecharModal();
      
      document.getElementById('input-cliente').value = '';
      document.getElementById('input-servico').value = '';
      document.getElementById('input-responsavel').value = '';
      document.getElementById('input-valor').value = '';
    }

    function mudarStatus(index, novoStatus) {
      orcamentos[index].status = novoStatus;
      salvarLocal();
    }

    function excluir(index) {
      orcamentos.splice(index, 1);
      salvarLocal();
    }

    function filtrar(status, btn) {
      filtroAtual = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderizar();
    }

    function exportarDados() {
      const blob = new Blob([JSON.stringify(orcamentos, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'orcamentos.json';
      a.click();
    }

    function importarDados() { document.getElementById('file-input').click(); }

    function carregarArquivo(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        orcamentos = JSON.parse(e.target.result);
        salvarLocal();
      };
      reader.readAsText(file);
    }

    renderizar();
  </script>
</body>
</html>
